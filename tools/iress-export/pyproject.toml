[project]
name = "iress-export"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "playwright>=1.65.2",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iress_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
